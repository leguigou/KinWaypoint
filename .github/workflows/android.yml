name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Une seule compilation à la fois : deux publications simultanées de l'APK de
# test se marchaient dessus (fichier absent → 404 au téléchargement).
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KW_KEYSTORE_BASE64: ${{ secrets.KW_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Clé de signature fixe : indispensable pour que chaque nouvel APK
      # s'installe PAR-DESSUS le précédent (sinon Android refuse la mise à jour).
      - name: Clé de signature
        run: |
          if [ -n "$KW_KEYSTORE_BASE64" ]; then
            echo "$KW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kinwaypoint.jks"
            echo "KW_KEYSTORE_FILE=$RUNNER_TEMP/kinwaypoint.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret KW_KEYSTORE_BASE64 absent : refus de publier une release signée avec une clé jetable."
            exit 1
          else
            echo "::warning::Secret KW_KEYSTORE_BASE64 absent : APK signé avec une clé de debug jetable (test uniquement, non installable en mise à jour)."
          fi

      - name: Tests et build release APK
        env:
          KW_KEYSTORE_PASSWORD: ${{ secrets.KW_KEYSTORE_PASSWORD }}
          KW_KEY_ALIAS: ${{ secrets.KW_KEY_ALIAS }}
          KW_KEY_PASSWORD: ${{ secrets.KW_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/kinwaypoint-${GITHUB_SHA::7}.apk"

      - name: Vérifier la signature de l'APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          echo "apk : $APK"
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt

          # Garde-fou : sans cette clé exacte, plus aucune mise à jour ne
          # s'installerait par-dessus l'app déjà déployée sur les téléphones.
          EXPECTED=12619199f2345cdefe4373c5d7a26fde2227f4d7b70d16cf44aca63f36fe0ee4
          grep -qi "$EXPECTED" /tmp/certs.txt || {
            echo "::error::APK signé avec une autre clé que celle de KinWaypoint — mise à jour impossible en l'état."
            exit 1
          }

          # Garde-fou : un applicationId différent crée une application distincte.
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:" || true
          "$BT/aapt2" dump badging "$APK" | grep -q "package: name='fr.kinwaypoint.app'" || {
            echo "::error::applicationId inattendu : l'app ne remplacerait pas l'installation existante."
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinwaypoint
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Version de test : l'APK seul (non zippé), sous un lien fixe ouvrable
      # directement depuis le téléphone. Remplacement « sans trou » : le nouvel
      # APK est envoyé sous un nom temporaire, puis l'ancien est supprimé et le
      # nouveau renommé (≈ 1 s d'indisponibilité au lieu de la durée d'envoi).
      - name: Publier la version de test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=test-latest
          FINAL=kinwaypoint-test.apk
          TEMP="kinwaypoint-test-${GITHUB_SHA::7}.apk"
          cp "$(ls app/build/outputs/apk/release/kinwaypoint-*.apk | head -1)" "$RUNNER_TEMP/$TEMP"
          NOTES="APK de test construit automatiquement depuis \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA}).
          Lien direct : https://github.com/${REPO}/releases/download/${TAG}/${FINAL}
          Non destiné aux téléphones des enfants tant qu'il n'est pas validé."

          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --prerelease --title "Version de test (dernier build)" --notes "$NOTES"
          fi

          gh release upload "$TAG" "$RUNNER_TEMP/$TEMP" -R "$REPO" --clobber

          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"')
          NEW_ID=$(echo "$ASSETS" | awk -v n="$TEMP" '$2==n {print $1}')
          # Supprime l'ancien APK et d'éventuels restes temporaires d'un build interrompu.
          echo "$ASSETS" | awk -v n="$TEMP" '$2!=n && $2 ~ /^kinwaypoint-test/ {print $1}' | while read -r id; do
            gh api -X DELETE "repos/$REPO/releases/assets/$id"
          done
          gh api -X PATCH "repos/$REPO/releases/assets/$NEW_ID" -f name="$FINAL" >/dev/null
          gh release edit "$TAG" -R "$REPO" --notes "$NOTES"
          echo "Publié : https://github.com/${REPO}/releases/download/${TAG}/${FINAL}"

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # Dépôt maison : garde chaque APK avec sa version et son empreinte, dans
      # l'ordre chronologique. Ignoré silencieusement si le secret est absent, et
      # jamais bloquant : le build reste vert même si le dépôt est injoignable.
      - name: Déposer l'APK dans le dépôt
        continue-on-error: true
        env:
          KW_HUB_TOKEN: ${{ secrets.KW_HUB_TOKEN }}
        run: |
          if [ -z "${KW_HUB_TOKEN}" ]; then
            echo "Secret KW_HUB_TOKEN absent : dépôt ignoré."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/kinwaypoint-*.apk | head -1)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTE=$(git log -1 --pretty=%s | cut -c1-160)
          curl -sS --fail-with-body -m 300 -X POST --data-binary @"$APK" \
            -H "X-Admin-Token: ${KW_HUB_TOKEN}" \
            -H "X-Filename: kinwaypoint-${GITHUB_SHA::7}-v${VERSION}.apk" \
            -H "X-Version: ${VERSION} (${CODE})" \
            -H "X-Note: ${NOTE}" \
            "https://famille.deloffre.fr/config/apk/upload"
          echo
