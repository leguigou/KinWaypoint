name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KW_KEYSTORE_BASE64: ${{ secrets.KW_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Clé de signature fixe : indispensable pour que chaque nouvel APK
      # s'installe PAR-DESSUS le précédent (sinon Android refuse la mise à jour).
      - name: Clé de signature
        run: |
          if [ -n "$KW_KEYSTORE_BASE64" ]; then
            echo "$KW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kinwaypoint.jks"
            echo "KW_KEYSTORE_FILE=$RUNNER_TEMP/kinwaypoint.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret KW_KEYSTORE_BASE64 absent : refus de publier une release signée avec une clé jetable."
            exit 1
          else
            echo "::warning::Secret KW_KEYSTORE_BASE64 absent : APK signé avec une clé de debug jetable (test uniquement, non installable en mise à jour)."
          fi

      - name: Tests et build release APK
        env:
          KW_KEYSTORE_PASSWORD: ${{ secrets.KW_KEYSTORE_PASSWORD }}
          KW_KEY_ALIAS: ${{ secrets.KW_KEY_ALIAS }}
          KW_KEY_PASSWORD: ${{ secrets.KW_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/kinwaypoint-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinwaypoint
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Version de test : l'APK seul (non zippé), sous un lien fixe ouvrable
      # directement depuis le téléphone, remplacé à chaque build.
      - name: APK de test téléchargeable
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cp app/build/outputs/apk/release/kinwaypoint-*.apk app/build/outputs/apk/release/kinwaypoint-test.apk

      - name: Publier la version de test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: "Version de test (dernier build)"
          body: |
            APK de test construit automatiquement depuis `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Lien direct : https://github.com/${{ github.repository }}/releases/download/test-latest/kinwaypoint-test.apk
            Non destiné aux téléphones des enfants tant qu'il n'est pas validé.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/kinwaypoint-test.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
